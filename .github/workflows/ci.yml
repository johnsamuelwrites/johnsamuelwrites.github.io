name: CI

on:
  # Documentation-only changes touch nothing a check reads.
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.ipynb"
      - "LICENSE*"
      - "CITATION.cff"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.ipynb"
      - "LICENSE*"
      - "CITATION.cff"
      - ".gitignore"

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # Only the commit under test, and none of its binary assets: no check
        # opens an image or a model, and the link check resolves targets
        # against the files git tracks (--tracked), so they need not be on disk.
        # This skips the history and roughly a third of the tree.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.png
            !*.PNG
            !*.jpg
            !*.JPG
            !*.jpeg
            !*.gif
            !*.bmp
            !*.webp
            !*.glb
            !*.pdf
            !*.woff2
            !*.ico
            !*.ipynb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/main/requirements-ci.txt

      - name: Install dependencies
        # Only what the checks and tests import; the site-building tools'
        # requirements.txt (gensim, nltk, pandas, pygit2) is not needed here.
        run: python -m pip install -r src/main/requirements-ci.txt

      - name: Run the checks
        # The unit tests and every site check, run in parallel (one per CPU):
        # they only read the repository, so none depends on another. The list,
        # with each check's purpose and ratchet history, is in ci_checks.py.
        # Each check's output is a collapsible group in the log below, followed
        # by a timing summary. Run one locally with:
        #   python src/main/ci_checks.py <name>   (names: --list)
        run: python src/main/ci_checks.py
