<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Scientific Research">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#c9d2da"/>
    </radialGradient>
    <linearGradient id="paperA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f6f8c"/>
      <stop offset="100%" stop-color="#1f3a4d"/>
    </linearGradient>
    <linearGradient id="paperB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ec3d3"/>
      <stop offset="100%" stop-color="#2394a6"/>
    </linearGradient>
    <linearGradient id="paperC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fb8b4"/>
      <stop offset="100%" stop-color="#5f8a8a"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9fbfd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8fdfe8" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="4" fill="#1e3a5f"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- dot grids -->
  <rect x="120" y="150" width="220" height="180" fill="url(#dots)" opacity="0.55"/>
  <rect x="700" y="560" width="200" height="220" fill="url(#dots)" opacity="0.55"/>

  <!-- ground shadow -->
  <ellipse cx="512" cy="905" rx="250" ry="24" fill="#2b4f6b" opacity="0.35" filter="url(#soft)"/>

  <!-- citation edges -->
  <g stroke="#1e2a38" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M330 300 L 500 470"/>
    <path d="M700 250 L 540 470"/>
    <path d="M260 640 L 470 520"/>
    <path d="M760 600 L 560 520"/>
    <path d="M330 300 Q 250 470 260 640"/>
    <path d="M700 250 Q 800 420 760 600"/>
  </g>
  <!-- edge nodes -->
  <g stroke="#1e2a38" stroke-width="12">
    <circle cx="330" cy="300" r="26" fill="#9fb8b4"/>
    <circle cx="700" cy="250" r="26" fill="#3ec3d3"/>
    <circle cx="260" cy="640" r="26" fill="#3ec3d3"/>
    <circle cx="760" cy="600" r="26" fill="#9fb8b4"/>
  </g>

  <!-- surrounding papers -->
  <g stroke="#1e2a38" stroke-width="12" stroke-linejoin="round">
    <rect x="240" y="180" width="130" height="160" rx="14" fill="url(#paperC)"/>
    <rect x="660" y="120" width="130" height="160" rx="14" fill="url(#paperB)"/>
    <rect x="150" y="560" width="130" height="160" rx="14" fill="url(#paperB)"/>
    <rect x="720" y="520" width="130" height="160" rx="14" fill="url(#paperC)"/>
  </g>
  <g stroke="#eef3f5" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <path d="M268 222h74M268 250h74M268 278h46"/>
    <path d="M688 162h74M688 190h74M688 218h46"/>
    <path d="M178 602h74M178 630h74M178 658h46"/>
    <path d="M748 562h74M748 590h74M748 618h46"/>
  </g>

  <!-- central stack of papers -->
  <g stroke="#1e2a38" stroke-width="14" stroke-linejoin="round">
    <rect x="392" y="420" width="240" height="300" rx="20" fill="#6f95a8" transform="rotate(-8 512 570)"/>
    <rect x="392" y="420" width="240" height="300" rx="20" fill="#3f6f8c" transform="rotate(4 512 570)"/>
    <rect x="392" y="420" width="240" height="300" rx="20" fill="url(#paperA)"/>
  </g>
  <g stroke="#eef3f5" stroke-width="14" stroke-linecap="round" opacity="0.95">
    <path d="M436 480h150M436 528h150M436 576h150M436 624h96"/>
  </g>
  <!-- DOI-like tag on the central paper -->
  <rect x="436" y="662" width="152" height="30" rx="15" fill="#3ec3d3" stroke="#1e2a38" stroke-width="8"/>

  <!-- magnifying glass -->
  <g stroke="#1e2a38" stroke-linecap="round">
    <line x1="668" y1="700" x2="800" y2="832" stroke-width="44"/>
    <line x1="668" y1="700" x2="800" y2="832" stroke="#5f8a8a" stroke-width="20"/>
    <circle cx="600" cy="632" r="120" fill="url(#lens)" stroke-width="30"/>
    <circle cx="600" cy="632" r="120" fill="none" stroke="#3ec3d3" stroke-width="10"/>
  </g>
  <path d="M540 580 q 20 -40 70 -50" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
</svg>
