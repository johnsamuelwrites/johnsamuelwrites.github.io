<!DOCTYPE html>
<html lang="{{lang}}">

    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Language" content="{{lang}}" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="../../images/logo/favicon.png" />
        <title>{{title}}</title>
{{alternates}}
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --bg-primary: #fafbfd;
                --bg-secondary: #ffffff;
                --accent-blue: #2563eb;
                --accent-purple: #7c3aed;
                --accent-orange: #f59e0b;
                --accent-light: #dbeafe;
                --text-primary: #1e293b;
                --text-secondary: #475569;
                --shadow-sm: 0 2px 8px rgba(37, 99, 235, 0.08);
                --shadow-md: 0 8px 24px rgba(37, 99, 235, 0.12);
                --shadow-lg: 0 20px 40px rgba(37, 99, 235, 0.15);
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                background: var(--bg-primary);
                color: var(--text-primary);
                line-height: 1.6;
            }

            /* Fixed Navigation */
            nav {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                background: rgba(255, 255, 255, 0.85);
                -webkit-backdrop-filter: blur(12px);
                backdrop-filter: blur(12px);
                z-index: 1000;
                border-bottom: 1px solid rgba(37, 99, 235, 0.1);
            }

            .nav-container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 1rem 2rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .nav-left {
                display: flex;
                align-items: center;
                gap: 2rem;
            }

            .nav-title {
                font-size: 1.1rem;
                font-weight: 600;
                color: var(--accent-blue);
                text-decoration: none;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav-title:hover {
                color: var(--accent-purple);
                transform: translateY(-1px);
            }

            .nav-subtitle {
                font-size: 0.95rem;
                color: var(--text-secondary);
                text-decoration: none;
                transition: all 0.3s;
            }

            .nav-subtitle:hover {
                color: var(--accent-blue);
            }

            .breadcrumb {
                display: flex;
                gap: 0.5rem;
                list-style: none;
                flex-wrap: wrap;
            }

            .breadcrumb li {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .breadcrumb li:not(:last-child)::after {
                content: '→';
                color: var(--accent-blue);
                opacity: 0.5;
            }

            .breadcrumb a {
                color: var(--text-secondary);
                text-decoration: none;
                font-size: 0.9rem;
                padding: 0.25rem 0.75rem;
                border-radius: 0.5rem;
                transition: all 0.3s;
            }

            .breadcrumb a:hover {
                background: var(--accent-light);
                color: var(--accent-blue);
            }

            /* Hero Section */
            .hero {
                margin-top: 80px;
                padding: 4rem 2rem;
                max-width: 1400px;
                margin-left: auto;
                margin-right: auto;
                display: grid;
                grid-template-columns: 1fr 400px;
                gap: 4rem;
                align-items: center;
            }

            .hero-content h1 {
                font-size: 4.5rem;
                font-weight: 800;
                color: var(--accent-blue);
                letter-spacing: -0.03em;
                line-height: 1.1;
                margin-bottom: 1.5rem;
                background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .hero-content p {
                font-size: 1.2rem;
                color: var(--text-secondary);
                line-height: 1.8;
                max-width: 600px;
            }

            /* Animated SVG - Knowledge Network */
            .hero-svg {
                width: 100%;
                height: 400px;
            }

            @keyframes float {

                0%,
                100% {
                    transform: translateY(0) scale(1);
                }

                50% {
                    transform: translateY(-15px) scale(1.05);
                }
            }

            @keyframes pulse {

                0%,
                100% {
                    opacity: 0.3;
                }

                50% {
                    opacity: 0.8;
                }
            }

            @keyframes rotate {
                from {
                    transform: rotate(0deg);
                }

                to {
                    transform: rotate(360deg);
                }
            }

            @keyframes dash {
                to {
                    stroke-dashoffset: 0;
                }
            }

            /* Language Selector */
            .language-selector {
                display: flex;
                justify-content: center;
                gap: 1rem;
            }

            .lang-btn {
                padding: 0.75rem 2rem;
                border-radius: 2rem;
                text-decoration: none;
                font-weight: 600;
                transition: all 0.3s;
                border: 2px solid transparent;
            }

            .lang-btn.active {
                background: var(--accent-blue);
                color: white;
            }

            .lang-btn:not(.active) {
                background: var(--bg-secondary);
                color: var(--text-secondary);
                border-color: rgba(37, 99, 235, 0.2);
            }

            .lang-btn:not(.active):hover {
                border-color: var(--accent-blue);
                color: var(--accent-blue);
                transform: translateY(-2px);
                box-shadow: var(--shadow-md);
            }

            /* Main Content */
            .container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 0 2rem 4rem;
            }

            .section-header {
                position: relative;
                margin: 4rem 0 3rem;
                padding-bottom: 1rem;
            }

            .section-header h2 {
                font-size: 2.5rem;
                font-weight: 700;
                color: var(--accent-blue);
                display: inline-block;
                position: relative;
            }

            .section-header h2::after {
                content: '';
                position: absolute;
                bottom: -0.5rem;
                left: 0;
                width: 60%;
                height: 4px;
                background: linear-gradient(90deg, var(--accent-orange), var(--accent-purple));
                border-radius: 2px;
            }

            /* Course Grid */
            .course-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
                gap: 2rem;
                margin-bottom: 3rem;
            }

            .course-card {
                background: var(--bg-secondary);
                border-radius: 1.5rem;
                padding: 2rem;
                border: 2px solid rgba(37, 99, 235, 0.1);
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                position: relative;
                overflow: hidden;
                -webkit-user-select: text;
                user-select: text;
                cursor: auto;
            }

            .course-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background:
                    radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.05) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 50%);
                opacity: 0;
                transition: opacity 0.4s;
                pointer-events: none;
                z-index: 0;
            }

            .course-card:hover {
                transform: translateY(-12px) scale(1.02);
                box-shadow: var(--shadow-lg);
                border-color: var(--accent-blue);
            }

            .course-card:hover::before {
                opacity: 1;
            }

            .course-icon {
                width: 80px;
                height: 80px;
                background: linear-gradient(135deg, var(--accent-light), rgba(124, 58, 237, 0.1));
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 1.5rem;
                transition: all 0.4s;
                animation: morph 4s ease-in-out infinite;
                position: relative;
                z-index: 1;
            }

            @keyframes morph {

                0%,
                100% {
                    border-radius: 50% 40% 40% 50% / 50% 40% 60% 50%;
                }

                25% {
                    border-radius: 40% 50% 50% 40% / 40% 50% 50% 60%;
                }

                50% {
                    border-radius: 50% 50% 40% 40% / 60% 50% 40% 50%;
                }

                75% {
                    border-radius: 40% 40% 50% 50% / 50% 60% 50% 40%;
                }
            }

            .course-card:hover .course-icon {
                transform: scale(1.15) rotate(10deg);
            }

            .course-icon svg {
                width: 40px;
                height: 40px;
            }

            .course-title {
                font-size: 1.5rem;
                font-weight: 700;
                color: var(--accent-blue);
                margin-bottom: 1rem;
                text-decoration: none;
                display: block;
                letter-spacing: -0.01em;
                transition: color 0.3s;
                position: relative;
                z-index: 1;
                cursor: pointer;
            }

            .course-card:hover .course-title {
                color: var(--accent-purple);
            }

            .course-details {
                list-style: none;
                margin-top: 1.5rem;
                position: relative;
                z-index: 1;
            }

            .course-details li {
                padding: 0.5rem 0;
                font-size: 0.95rem;
                display: flex;
                align-items: flex-start;
                gap: 0.75rem;
                color: var(--text-secondary);
            }

            .course-details b {
                color: var(--accent-orange);
                font-weight: 600;
                min-width: 120px;
            }

            .course-links {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-top: 0.5rem;
            }

            .course-links a {
                display: inline-block;
                padding: 0.25rem 0.75rem;
                background: var(--accent-light);
                color: var(--accent-blue);
                text-decoration: none;
                border-radius: 0.5rem;
                font-size: 0.85rem;
                font-weight: 500;
                transition: all 0.3s;
                position: relative;
                z-index: 2;
                cursor: pointer;
            }

            .course-links a:hover {
                background: var(--accent-blue);
                color: white;
                transform: translateY(-2px);
                box-shadow: var(--shadow-sm);
            }

            /* Footer */
            footer {
                background: var(--bg-secondary);
                border-top: 1px solid rgba(37, 99, 235, 0.1);
                padding: 2rem;
                margin-top: 4rem;
            }

            .footer-content {
                max-width: 1400px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
            }

            .footer-content p {
                color: var(--text-secondary);
                font-size: 0.9rem;
            }

            .license-img {
                height: 31px;
                transition: transform 0.3s;
            }

            .license-img:hover {
                transform: scale(1.05);
            }

            /* Responsive Design */
            @media (max-width: 1024px) {
                .hero {
                    grid-template-columns: 1fr;
                    gap: 2rem;
                }

                .hero-svg {
                    height: 300px;
                }

                .hero-content h1 {
                    font-size: 3rem;
                }
            }

            @media (max-width: 768px) {
                .nav-container {
                    flex-direction: column;
                    gap: 1rem;
                    padding: 1rem;
                }

                .nav-left {
                    flex-direction: column;
                    gap: 0.5rem;
                    text-align: center;
                }

                .breadcrumb {
                    justify-content: center;
                }

                .hero {
                    margin-top: 180px;
                    padding: 2rem 1rem;
                }

                .hero-content h1 {
                    font-size: 2.5rem;
                }

                .hero-content p {
                    font-size: 1rem;
                }

                .section-header h2 {
                    font-size: 2rem;
                }

                .course-grid {
                    grid-template-columns: 1fr;
                    gap: 1.5rem;
                }

                .container {
                    padding: 0 1rem 2rem;
                }

                .footer-content {
                    flex-direction: column;
                    text-align: center;
                }
            }
        </style>
        <link rel="stylesheet" href="../../ui/teaching/teaching-timeline.css" />
        <script defer src="../../ui/teaching/teaching-timeline.js"></script>
    </head>

    <body vocab="http://schema.org/">
        <!-- Navigation -->
{{nav}}

{{region}}

        <!-- Footer -->
{{footer}}
    </body>

</html>
